# MuJoCo scenes for the SONIC sim. xr_camera_teleop.sim.scene_builder loads the upstream G1 scene with MjSpec,
# adds what is below and writes data/sim/scenes/<course>.xml. The upstream files are not touched.

# Upstream sim2sim scene (robot g1_29dof_with_hand.xml + floor, light, skybox), relative to the SONIC source
# (configs/sonic_assets.yaml). This is the scene upstream's run_sim_loop.py uses.
base_scene: gear_sonic/data/robot_model/model_data/g1/scene_43dof.xml

render:
  offscreen_size: [1920, 1080]   # offscreen framebuffer; must hold the largest offscreen image
  shadow_size: 2048              # upstream default 4096 costs ~2x GPU time for no visible gain at 960x540
  # Robot collision meshes duplicate the visual meshes (~620k faces each set). Drawing them only when this
  # geom group is enabled halves the triangles of every view. Rendering only; physics is unchanged.
  robot_collision_group: 3       # viewer key 3 shows them

# ZED 2i stereo pair on the head mount (PLAN §7). Cameras are added to `body`, one per eye.
robot_camera:
  body: torso_link
  # Optical centre (midpoint of the two lenses) in torso_link, metres. From the g1_zed_mount CAD v5
  # (~/g1_zed_mount/exports/zed_mount_params.json, cam_T_default): (85, -60, 480) mm in the URDF torso frame,
  # left lens on the robot's centre line. Upstream's MJCF puts the head mesh 10 mm lower in torso_link than
  # that URDF does (-0.054 vs -0.044), and the mount sits on the head, so z is 0.470 here.
  center: [0.085, -0.060, 0.470]
  pitch_down_deg: 50.0           # mount default; the mount allows 35-60
  baseline: 0.120
  fovy_deg: 70.0                 # ZED 2i 2.1 mm lens, vertical (4 mm lens: 44)
  resolution: [960, 540]         # per eye
  names: [zed_left, zed_right]

# Obstacles (sim/courses.py). Each is built in its own frame: x is the direction you walk onto it, from its near
# edge at x = 0; y is centred on it; z = 0 on the floor. Metres, degrees. Optional per feature: rgba, contact
# {friction: [slide, torsion, roll], condim, solref, solimp} (a contact uses the larger friction/condim of the pair).
features:
  # 2 m wide: walking 6 m with the stick drifts sideways up to ~0.5 m (open loop, P8_results.md), and a ramp's side
  # is a 15 cm drop.
  ramp5:  {type: ramp, angle_deg: 5,  rise: 0.15, plateau: 1.2, width: 2.0}    # 1.71 m up, 1.2 m flat, 1.71 m down
  ramp10: {type: ramp, angle_deg: 10, rise: 0.15, plateau: 1.2, width: 2.0}    # 0.85 m slopes
  ramp15: {type: ramp, angle_deg: 15, rise: 0.15, plateau: 1.2, width: 2.0}    # 0.56 m slopes
  cross5: {type: cross_slope, angle_deg: 5, length: 4.0, width: 2.0, lead: 1.2}   # left edge 17.5 cm up, centre 8.7 cm
  steps3: {type: steps, rise: 0.03, count: 2, tread: 0.4, landing: 0.8, width: 2.0}   # 2 up, landing, 2 down
  steps6: {type: steps, rise: 0.06, count: 2, tread: 0.4, landing: 0.8, width: 2.0}
  rough2: {type: rough, height: 0.02, length: 2.4, width: 2.0, cell: 0.025, bump: 0.06, border: 0.2, seed: 1}
  # Sized for the G1 (1.32 m): the palm-down grasp works with the top at 0.82 m. Lower, the cube is at the end of the
  # arm's reach; higher (0.92 m tried), SONIC no longer brings the wrist into the palm-down pose. Known conflict: the
  # hands parked in WALK mode (D8) reach 0.36 m ahead of the pelvis at 0.64-0.87 m, so they touch the top's edge when
  # the robot stands close enough to grasp (P8_results.md, risks).
  table:  {type: table, depth: 0.5, width: 0.8, height: 0.82}
  # PLAN §7: 5 cm, 0.1 kg. Its contact is the scene's grasp tuning (the robot's hand is upstream's, unchanged).
  cube:   {type: cube, size: 0.06, mass: 0.1, contact: {friction: [2.0, 0.02, 0.001], condim: 4}}
  mark:   {type: mark, radius: 0.12}

# Placements: {feature, [name], pos: [x, y], [yaw_deg], [atop: <earlier table>]}; world x forward of the robot's start,
# y to its left. `atop` stacks onto a table: pos is then in the table's top frame (x from its near edge).
courses:
  flat: []                       # the upstream floor only
  # The morning test (PLAN §0): a corridor straight ahead with a yellow mark at 1.5, 4.1, 6.7 and 9.3 m; at each
  # mark the courses branch off 0.7 m to the left (ramp 5 deg, ramp 10 deg, ramp 15 deg, cross slope) and to the
  # right (the tables with the cube, steps 3 cm, steps 6 cm, rough ground). Turn on a mark and walk onto it.
  morning:
    - {feature: mark, name: start, pos: [0.0, 0.0]}
    - {feature: mark, name: mark1, pos: [1.5, 0.0]}
    - {feature: mark, name: mark2, pos: [4.1, 0.0]}
    - {feature: mark, name: mark3, pos: [6.7, 0.0]}
    - {feature: mark, name: mark4, pos: [9.3, 0.0]}
    - {feature: ramp5,  pos: [1.5, 0.7], yaw_deg: 90}
    - {feature: ramp10, pos: [4.1, 0.7], yaw_deg: 90}
    - {feature: ramp15, pos: [6.7, 0.7], yaw_deg: 90}
    - {feature: cross5, pos: [9.3, 0.7], yaw_deg: 90}
    - {feature: table, name: table_a, pos: [1.5, -0.55], yaw_deg: -90}
    - {feature: cube, atop: table_a, pos: [0.12, 0.0]}
    - {feature: table, name: table_b, pos: [2.6, -0.55], yaw_deg: -90}
    - {feature: steps3, pos: [4.1, -0.7], yaw_deg: -90}
    - {feature: steps6, pos: [6.7, -0.7], yaw_deg: -90}
    - {feature: rough2, pos: [9.3, -0.7], yaw_deg: -90}
  # One obstacle 1 m ahead of the start each (P8 characterisation; tools/course_test.py)
  ramp5:  [{feature: ramp5,  pos: [1.0, 0.0]}]
  ramp10: [{feature: ramp10, pos: [1.0, 0.0]}]
  ramp15: [{feature: ramp15, pos: [1.0, 0.0]}]
  steps3: [{feature: steps3, pos: [1.0, 0.0]}]
  steps6: [{feature: steps6, pos: [1.0, 0.0]}]
  rough2: [{feature: rough2, pos: [1.0, 0.0]}]
  cross5: [{feature: cross5, pos: [1.0, 0.0]}]
  # The cube test (tools/acceptance.py --only cube): table A's situation straight ahead, a short walk from the start
  table:
    - {feature: table, name: table, pos: [0.6, 0.0]}
    - {feature: cube, atop: table, pos: [0.12, -0.17]}
