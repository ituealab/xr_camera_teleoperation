# How the SONIC MuJoCo sim stack runs on the MSI (PLAN §7, §7a).
#   xr_camera_teleop.sim.run_sonic_sim  - physics (upstream gear_sonic DefaultEnv) + DDS, our real-time loop
#   xr_camera_teleop.sim.camera_publisher, .sim_viewer - its child processes, rendering from state snapshots
#   deploy/sonic_sim.sh                 - tmux launcher of the sim and the prebuilt SONIC deploy binary
# The DDS domain is not set here: it is the deploy binary's (configs/sonic_assets.yaml deploy.dds_domain).

course: flat                   # configs/sim_courses.yaml

dds:
  interface: lo

physics:
  dt: 0.005                    # 200 Hz (upstream SIMULATE_DT)
  elastic_band: true           # upstream: the robot starts hanging from a virtual band; key 9 drops it
  max_lag_s: 0.05              # further behind real time than this: drop the backlog (counted), never burst-step
  # Upstream's DDS bridge decodes SONIC's rt/lowcmd + 2x rt/dex3/*/cmd (500 Hz each) in Python listener threads.
  # With CPython's default 5 ms GIL switch interval a step could wait up to 5 ms behind them; 0.5 ms bounds that.
  gil_switch_interval_s: 0.0005

gantry:                        # sim/gantry.py: the band follows SONIC like a person at the real robot's gantry
  enabled: true
  release_after_s: 1.0         # SONIC controlling this long with the robot on the band: drop it
  catch_after_s: 0.3           # SONIC silent this long with the robot off the band: reset the robot, hang it again

keys:                          # sim operator keys (upstream handle_keyboard_button: 9, backspace, up/down/left/right)
  endpoint: tcp://127.0.0.1:5599   # the sim binds PULL; the viewer window and scripted tools PUSH key names

viewer:
  enabled: true                # needs a display; skipped with a warning when there is none
  fps: 60

cameras:
  names: [zed_left, zed_right] # MJCF cameras of the scene (configs/sim_courses.yaml robot_camera)
  fps: 30
  port: 5555                   # PUB, upstream sim camera format: msgpack {timestamps, images: base64 JPEG}
  jpeg_quality: 80

camera_bridge:                 # sim/camera_bridge.py: this stream -> the Quest server's stereo input (P5)
  sim_host: 127.0.0.1          # where cameras.port is
  bind: tcp://127.0.0.1:5605   # PUB, the stereo format of deploy/zed_stereo_stream.py (server --camera)
  quality: 80                  # re-encoded JPEG per eye (the sim's own JPEG stores RGB as BGR, P1)
  burn_clock: true             # sim time + state wall time (ms) in the top-left corner of both eyes

stats:
  endpoint: tcp://127.0.0.1:5598   # sim processes connect PUB here; tools/sim_perf.py binds SUB
  period_s: 1.0

deploy:                        # prebuilt g1_deploy_onnx_ref (paths: configs/sonic_assets.yaml)
  input_type: zmq_manager
  zmq_host: localhost
  zmq_port: 5556               # SONIC subscribes; fullbody_node (P2) / tools/sonic_drive.py bind PUB
  zmq_out_port: 5557           # SONIC telemetry PUB (topic g1_debug)
